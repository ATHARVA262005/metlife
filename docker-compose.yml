version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=AIzaSyAihflqadt3dQmXsuXPK-ItB4DCaWEZwR0
    volumes:
      # Mount local code for development (optional - comment out for production testing)
      - ./:/app
      # Exclude virtual environments
      - /app/.venv
      - /app/hac_env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
